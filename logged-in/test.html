<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - COMMAND ANALYTICS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>

    <style>
        :root {
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.4);
            --bg-dark: #040404;
            --panel-bg: #0d0d0d;
            --border: #1a1a1a;
        }
        
        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-dark); 
            color: #c0c0c0; 
            font-weight: 300;
            overflow-x: hidden;
        }

        /* --- Map Container --- */
        #heatmap-wrapper {
            position: relative;
            width: 100%;
            height: 600px;
            background: radial-gradient(circle at 50% 50%, #111 0%, #020202 100%);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            overflow: hidden;
        }

        /* Map Elements */
        .country { 
            fill: #141414; 
            stroke: #2a2a2a; 
            stroke-width: 0.5px; 
            transition: fill 0.2s;
        }
        .country:hover { fill: #1f1f1f; }

        .node-point { 
            fill: var(--accent); 
            stroke: #fff; 
            stroke-width: 1px; 
            cursor: pointer; 
            transition: r 0.2s;
        }
        .node-point:hover { 
            fill: #fff; 
            r: 6px !important; 
        }

        .node-pulse {
            fill: var(--accent);
            opacity: 0.4;
            animation: pulse-ring 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            pointer-events: none;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 0.8; }
            80% { transform: scale(2.5); opacity: 0; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* --- Floating UI --- */
        .map-overlay {
            position: absolute;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1rem;
            z-index: 10;
        }

        /* --- Node Inspector Modal --- */
        #inspector-modal {
            position: absolute;
            top: 20px; right: 20px;
            width: 300px;
            max-height: calc(100% - 40px);
            display: none;
            flex-direction: column;
            box-shadow: -10px 10px 40px rgba(0,0,0,0.8);
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .stat-value { font-family: 'Courier New', monospace; letter-spacing: -0.5px; }

        /* --- Tab Nav --- */
        .nav-btn {
            padding: 0.5rem 1rem;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-btn.active { color: #fff; border-color: var(--accent); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        
        <header class="flex justify-between items-end mb-8 border-b border-[#1a1a1a] pb-4">
            <div>
                <div class="flex items-center gap-3 mb-1">
                    <h1 class="text-3xl font-light tracking-tight text-white">COMMAND <span class="text-indigo-500 font-bold">VANA</span></h1>
                    <span class="bg-indigo-900/30 text-indigo-400 text-[10px] px-2 py-0.5 rounded border border-indigo-500/20">V5 DV</span>
                </div>
                <p class="text-gray-500 text-sm">Geospatial Intelligence & User Analytics</p>
            </div>
            
            <div class="flex gap-2">
                <button class="nav-btn active" data-tab="global">Global Map</button>
                <button class="nav-btn" data-tab="users">User List</button>
            </div>
        </header>

        <div id="tab-global">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                
                <div class="lg:col-span-3 relative">
                    <div id="heatmap-wrapper">
                        <div class="absolute bottom-6 right-6 flex flex-col gap-2">
                            <button id="zoom-in" class="w-10 h-10 bg-black/80 text-white border border-[#333] rounded-lg hover:bg-[#222]"><i class="fa-solid fa-plus"></i></button>
                            <button id="zoom-out" class="w-10 h-10 bg-black/80 text-white border border-[#333] rounded-lg hover:bg-[#222]"><i class="fa-solid fa-minus"></i></button>
                            <button id="reset-map" class="w-10 h-10 bg-black/80 text-indigo-400 border border-[#333] rounded-lg hover:bg-[#222]"><i class="fa-solid fa-compress"></i></button>
                        </div>

                        <div id="inspector-modal" class="map-overlay">
                            <div class="flex justify-between items-center mb-4 border-b border-[#333] pb-2">
                                <h3 class="text-white font-medium flex items-center gap-2">
                                    <i class="fa-solid fa-location-dot text-indigo-500"></i>
                                    <span id="inspect-location">Unknown</span>
                                </h3>
                                <button onclick="closeInspector()" class="text-gray-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <div id="inspect-content" class="overflow-y-auto max-h-[300px] space-y-2">
                                </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="bg-[#0d0d0d] border border-[#1a1a1a] rounded-xl p-5">
                        <h2 class="text-white text-lg font-light mb-1">Vana Analysis</h2>
                        <p class="text-xs text-gray-500 mb-4">Analyze timezone & email headers for exact plotting.</p>
                        
                        <button id="run-scan" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-900/20">
                            <i class="fa-solid fa-radar"></i> Run Geospatial Scan
                        </button>
                    </div>

                    <div id="vana-stats" class="bg-[#0d0d0d] border border-[#1a1a1a] rounded-xl p-5 hidden animate-pulse">
                        <div class="flex items-center gap-2 text-indigo-400 mb-3">
                            <i class="fa-solid fa-chart-pie"></i>
                            <span class="text-xs font-bold uppercase">Statistical Summary</span>
                        </div>
                        <div id="stats-content" class="space-y-4">
                            </div>
                    </div>

                    <div class="bg-[#0d0d0d] border border-[#1a1a1a] rounded-xl p-4">
                        <h4 class="text-xs text-gray-500 uppercase tracking-widest mb-3">Network Density</h4>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs"><span>North America</span> <span id="count-na" class="text-white font-mono">0</span></div>
                            <div class="flex justify-between text-xs"><span>Europe</span> <span id="count-eu" class="text-white font-mono">0</span></div>
                            <div class="flex justify-between text-xs"><span>Asia / Pacific</span> <span id="count-as" class="text-white font-mono">0</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-users" class="hidden">
            <div class="bg-[#0d0d0d] border border-[#1a1a1a] rounded-xl p-6">
                <table class="w-full text-left text-sm text-gray-400">
                    <thead class="border-b border-[#333] text-xs uppercase"><tr><th class="pb-2">User</th><th class="pb-2">Location Data</th><th class="pb-2">Status</th></tr></thead>
                    <tbody id="user-list-body"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { firebaseConfig } from "../firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const functions = getFunctions(app);
        const chatWithGroq = httpsCallable(functions, 'chatWithGroq');

        // --- GEO DATA LOOKUP ---
        // Maps Timezones/TLDs to exact Lat/Long for "Exact" plotting
        const geoLookup = {
            'America/New_York': [-74.006, 40.712],
            'America/Los_Angeles': [-118.243, 34.052],
            'America/Chicago': [-87.629, 41.878],
            'Europe/London': [-0.127, 51.507],
            'Europe/Berlin': [13.405, 52.520],
            'Asia/Tokyo': [139.691, 35.689],
            'Australia/Sydney': [151.209, -33.868],
            'Default_US': [-95.712, 37.090]
        };

        let mapSvg, g, zoom;
        let allUsers = [];

        // --- MAP INITIALIZATION ---
        async function initMap() {
            const container = document.getElementById('heatmap-wrapper');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Clear previous
            d3.select("#heatmap-wrapper svg").remove();

            mapSvg = d3.select("#heatmap-wrapper")
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .attr("viewBox", [0, 0, width, height]);

            // Group for zooming
            g = mapSvg.append("g");

            // Projection
            const projection = d3.geoMercator()
                .scale(width / 6)
                .translate([width / 2, height / 1.5]);

            const path = d3.geoPath().projection(projection);

            // Zoom Behavior
            zoom = d3.zoom()
                .scaleExtent([1, 8]) // Max zoom 8x
                .on("zoom", (event) => g.attr("transform", event.transform));

            mapSvg.call(zoom);

            // Load World Data
            try {
                const world = await d3.json("https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson");
                
                // Draw Countries
                g.selectAll("path")
                    .data(world.features)
                    .join("path")
                    .attr("d", path)
                    .attr("class", "country");

                // Bind Controls
                document.getElementById('zoom-in').onclick = () => mapSvg.transition().call(zoom.scaleBy, 1.5);
                document.getElementById('zoom-out').onclick = () => mapSvg.transition().call(zoom.scaleBy, 0.75);
                document.getElementById('reset-map').onclick = () => mapSvg.transition().call(zoom.transform, d3.zoomIdentity);

            } catch (err) {
                console.error("Map Data Error:", err);
            }

            return { projection };
        }

        // --- SCAN LOGIC ---
        document.getElementById('run-scan').addEventListener('click', async () => {
            const btn = document.getElementById('run-scan');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Scanning Metadata...`;
            btn.disabled = true;

            // 1. Fetch Users
            const snap = await getDocs(query(collection(db, 'users'), orderBy('createdAt', 'desc')));
            allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));

            // 2. Init Map
            const { projection } = await initMap();

            // 3. Process Locations (The "Exact" Logic)
            const locationClusters = {}; // Key: "Lat,Long", Value: [UserArray]

            allUsers.forEach(u => {
                let coords = null;
                let locName = "Unknown Region";

                // Priority 1: Real Coords (if saved)
                if (u.coords) {
                    coords = u.coords;
                    locName = "Custom Location";
                } 
                // Priority 2: Timezone Match
                else if (u.timeZone && geoLookup[u.timeZone]) {
                    coords = geoLookup[u.timeZone];
                    locName = u.timeZone;
                }
                // Priority 3: TLD/Heuristic Fallback
                else {
                    const email = u.email || "";
                    if (email.endsWith('.uk')) { coords = geoLookup['Europe/London']; locName = "London, UK"; }
                    else if (email.endsWith('.jp')) { coords = geoLookup['Asia/Tokyo']; locName = "Tokyo, JP"; }
                    else if (email.endsWith('.de')) { coords = geoLookup['Europe/Berlin']; locName = "Berlin, DE"; }
                    else { coords = geoLookup['Default_US']; locName = "United States"; }
                }

                // Add slight jitter for "Exact" feel if multiple people are in same city
                const jitter = 0.5; 
                const finalCoords = [
                    coords[0] + (Math.random() - 0.5) * jitter,
                    coords[1] + (Math.random() - 0.5) * jitter
                ];

                const key = locName; 
                if (!locationClusters[key]) locationClusters[key] = { coords: finalCoords, users: [] };
                locationClusters[key].users.push(u);
            });

            // 4. Plot Points
            Object.values(locationClusters).forEach(cluster => {
                const [x, y] = projection(cluster.coords);
                const size = Math.min(cluster.users.length * 2 + 3, 15); // Size based on density

                // Pulse Ring (Underneath)
                g.append("circle")
                    .attr("cx", x).attr("cy", y)
                    .attr("r", size * 1.5)
                    .attr("class", "node-pulse");

                // Actual Point
                g.append("circle")
                    .attr("cx", x).attr("cy", y)
                    .attr("r", size)
                    .attr("class", "node-point")
                    .on("click", (e) => {
                        e.stopPropagation(); // Prevent zoom
                        openInspector(cluster.users, x, y);
                    });
            });

            // 5. Run Vana Analysis
            generateVanaStats(locationClusters);
            
            btn.innerHTML = `<i class="fa-solid fa-check"></i> Scan Complete`;
            btn.disabled = false;
        });

        // --- INSPECTOR UI ---
        window.openInspector = (users, x, y) => {
            const modal = document.getElementById('inspector-modal');
            const list = document.getElementById('inspect-content');
            
            document.getElementById('inspect-location').textContent = `${users.length} Users in Cluster`;
            
            list.innerHTML = users.map(u => `
                <div class="bg-[#1a1a1a] p-2 rounded flex items-center gap-3 border border-[#333]">
                    <div class="w-8 h-8 rounded-full bg-indigo-900 text-indigo-200 flex items-center justify-center text-xs font-bold">
                        ${(u.username||'?').charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <div class="text-white text-xs font-bold">${u.username || 'Unknown'}</div>
                        <div class="text-[10px] text-gray-500">${u.email || u.id}</div>
                    </div>
                </div>
            `).join('');

            modal.style.display = 'flex';
        };

        window.closeInspector = () => {
            document.getElementById('inspector-modal').style.display = 'none';
        };

        // --- VANA AI STATS ---
        async function generateVanaStats(clusters) {
            const statsBox = document.getElementById('vana-stats');
            const content = document.getElementById('stats-content');
            statsBox.classList.remove('hidden');
            
            content.innerHTML = `<div class="text-gray-500 text-sm"><i class="fa-solid fa-circle-notch fa-spin"></i> Generating Intelligence Report...</div>`;

            try {
                const totalUsers = allUsers.length;
                const activeRegions = Object.keys(clusters).length;
                
                const prompt = `
                    Analyze this geospatial user data:
                    Total Users: ${totalUsers}.
                    Active Hubs: ${activeRegions}.
                    Clusters: ${Object.keys(clusters).join(', ')}.
                    
                    Provide a JSON response with exactly these 3 keys:
                    1. "density_analysis": A sentence about where the most users are.
                    2. "growth_velocity": A sentence about the projected expansion.
                    3. "dominance_score": A number from 0-100 based on global spread.
                    Format as JSON only.
                `;

                const response = await chatWithGroq({
                    messages: [{ role: 'user', content: prompt }],
                    model: 'llama-3.1-8b-instant'
                });

                const raw = response.data.choices[0].message.content;
                // Simple parser if AI returns extra text
                const jsonStr = raw.substring(raw.indexOf('{'), raw.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonStr);

                content.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-[#111] p-3 rounded-lg border border-[#222]">
                            <div class="text-[10px] text-gray-500 uppercase">Dominance Score</div>
                            <div class="text-2xl text-white font-mono">${data.dominance_score}<span class="text-sm text-gray-600">/100</span></div>
                        </div>
                        <div class="bg-[#111] p-3 rounded-lg border border-[#222]">
                            <div class="text-[10px] text-gray-500 uppercase">Active Hubs</div>
                            <div class="text-2xl text-indigo-400 font-mono">${activeRegions}</div>
                        </div>
                    </div>
                    <div class="space-y-2 mt-2">
                        <p class="text-sm text-gray-300 border-l-2 border-indigo-500 pl-3">
                            <strong class="text-white block text-xs uppercase mb-1">Density Analysis</strong>
                            ${data.density_analysis}
                        </p>
                        <p class="text-sm text-gray-300 border-l-2 border-green-500 pl-3">
                            <strong class="text-white block text-xs uppercase mb-1">Growth Velocity</strong>
                            ${data.growth_velocity}
                        </p>
                    </div>
                `;
                statsBox.classList.remove('animate-pulse');
            } catch (e) {
                console.error(e);
                content.innerHTML = `<span class="text-red-500">AI Analysis Failed.</span>`;
            }
        }
        
        // Tab switching
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                if(btn.dataset.tab === 'global') {
                    document.getElementById('tab-global').classList.remove('hidden');
                    document.getElementById('tab-users').classList.add('hidden');
                } else {
                    document.getElementById('tab-global').classList.add('hidden');
                    document.getElementById('tab-users').classList.remove('hidden');
                    // Render simple list
                    document.getElementById('user-list-body').innerHTML = allUsers.map(u => `
                        <tr class="border-b border-[#222]">
                            <td class="py-2 text-white">${u.username || 'User'}</td>
                            <td class="py-2">${u.timeZone || 'Unknown'}</td>
                            <td class="py-2 text-green-500">Active</td>
                        </tr>
                    `).join('');
                }
            });
        });

    </script>
</body>
</html>
