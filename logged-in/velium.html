<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - VELIUM</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../injector.js"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            background-color: #09090b; /* Zinc-950 */
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Fullscreen Player Styles */
        #fullscreen-player {
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.4s ease;
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }

        #fullscreen-player.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* Dynamic Background Blur */
        .glass-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-size: cover;
            background-position: center;
            filter: blur(80px) saturate(180%) brightness(0.6);
            transform: scale(1.2); /* Prevent white edges from blur */
            transition: background-image 0.5s ease;
        }

        /* Album Art Shadow */
        .art-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #fff;
            margin-top: -4px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body class="flex flex-col">

    <div id="loader" class="fixed inset-0 bg-black z-[100] flex items-center justify-center text-white">
        <div class="animate-pulse text-xl font-bold tracking-widest">VELIUM</div>
    </div>

    <div id="app-content" class="flex-grow flex flex-col h-full hidden relative z-10">
        
        <header class="h-16 border-b border-zinc-800 flex items-center justify-between px-6 bg-zinc-900/80 backdrop-blur-md z-20">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">Velium</h1>
                <div class="relative group">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                    <input type="text" placeholder="Search songs..." class="bg-zinc-800 text-sm rounded-full pl-10 pr-4 py-2 w-64 focus:outline-none focus:ring-1 focus:ring-purple-500 transition-all">
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="openCreatePlaylistModal()" class="text-sm bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-full transition-colors">
                    <i class="fa-solid fa-plus mr-2"></i>New Playlist
                </button>
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600"></div>
            </div>
        </header>

        <main class="flex-grow flex overflow-hidden">
            <aside class="w-64 bg-zinc-900/50 border-r border-zinc-800 flex flex-col p-4">
                <div class="text-xs font-semibold text-zinc-500 mb-4 uppercase tracking-wider">Library</div>
                <nav class="space-y-1">
                    <a href="#" class="block px-3 py-2 rounded-md bg-zinc-800 text-white text-sm font-medium"><i class="fa-solid fa-music mr-3 text-purple-400"></i>Songs</a>
                    <a href="#" class="block px-3 py-2 rounded-md hover:bg-zinc-800/50 text-zinc-400 text-sm font-medium transition-colors"><i class="fa-solid fa-heart mr-3"></i>Favorites</a>
                </nav>

                <div class="mt-8 text-xs font-semibold text-zinc-500 mb-4 uppercase tracking-wider flex justify-between items-center">
                    <span>Playlists</span>
                    <i class="fa-solid fa-plus hover:text-white cursor-pointer" onclick="openCreatePlaylistModal()"></i>
                </div>
                <div id="playlist-list" class="space-y-1 overflow-y-auto flex-grow">
                    <div class="text-zinc-600 text-sm italic px-3">No playlists yet</div>
                </div>
            </aside>

            <div class="flex-grow overflow-y-auto p-8 bg-zinc-950">
                <h2 class="text-2xl font-bold mb-6">All Songs</h2>
                <div id="song-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    </div>
            </div>
        </main>

        <div id="mini-player" class="h-20 bg-zinc-900 border-t border-zinc-800 flex items-center px-4 justify-between z-30 relative">
            <div class="flex items-center gap-4 w-1/3">
                <div class="relative group cursor-pointer" onclick="toggleFullscreenPlayer()">
                    <img id="mini-cover" src="https://via.placeholder.com/60" class="w-14 h-14 rounded-md object-cover shadow-lg group-hover:brightness-75 transition-all">
                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="fa-solid fa-expand text-white drop-shadow-md"></i>
                    </div>
                </div>
                <div class="flex flex-col justify-center">
                    <span id="mini-title" class="text-sm font-semibold text-white truncate">Not Playing</span>
                    <span id="mini-artist" class="text-xs text-zinc-400 truncate">Select a song</span>
                </div>
            </div>

            <div class="flex flex-col items-center w-1/3 gap-1">
                <div class="flex items-center gap-6">
                    <button class="text-zinc-400 hover:text-white"><i class="fa-solid fa-backward-step text-lg"></i></button>
                    <button id="mini-play-btn" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition-transform">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button class="text-zinc-400 hover:text-white"><i class="fa-solid fa-forward-step text-lg"></i></button>
                </div>
                <div class="w-full max-w-md flex items-center gap-2 text-xs text-zinc-500 font-mono">
                    <span>0:00</span>
                    <div class="h-1 flex-grow bg-zinc-800 rounded-full overflow-hidden">
                        <div class="h-full bg-white w-0"></div>
                    </div>
                    <span>0:00</span>
                </div>
            </div>

            <div class="flex items-center justify-end w-1/3 gap-4">
                <i class="fa-solid fa-volume-high text-zinc-400 text-sm"></i>
                <div class="w-24 h-1 bg-zinc-700 rounded-full">
                    <div class="w-2/3 h-full bg-zinc-400 rounded-full"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="fullscreen-player" class="fixed inset-0 z-50 flex flex-col text-white">
        <div id="fs-bg" class="glass-bg"></div>
        <div class="absolute inset-0 bg-black/30 z-0"></div> <div class="relative z-10 flex justify-between items-center p-8 mt-4">
            <button onclick="toggleFullscreenPlayer()" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center hover:bg-white/20 transition-colors">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
            <div class="text-xs font-bold tracking-widest text-white/70 uppercase">Now Playing</div>
            <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center hover:bg-white/20 transition-colors">
                <i class="fa-solid fa-ellipsis"></i>
            </button>
        </div>

        <div class="relative z-10 flex-grow flex flex-col items-center justify-center px-8">
            <img id="fs-cover" src="" class="w-[80vw] max-w-sm aspect-square object-cover rounded-xl art-shadow mb-12 transform hover:scale-[1.02] transition-transform duration-500">
            
            <div class="w-full max-w-lg">
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <h2 id="fs-title" class="text-3xl font-bold mb-1 drop-shadow-md">Song Title</h2>
                        <h3 id="fs-artist" class="text-xl text-white/80 drop-shadow-md">Artist Name</h3>
                    </div>
                    <button class="text-white/60 hover:text-white"><i class="fa-regular fa-heart text-2xl"></i></button>
                </div>

                <div class="mb-8 group">
                    <input type="range" min="0" max="100" value="30" class="w-full h-1 cursor-pointer">
                    <div class="flex justify-between text-xs font-medium text-white/60 mt-2 font-mono">
                        <span>1:12</span>
                        <span>3:45</span>
                    </div>
                </div>

                <div class="flex items-center justify-center gap-12">
                    <button class="text-white/70 hover:text-white transition-colors"><i class="fa-solid fa-backward-step text-3xl"></i></button>
                    <button id="fs-play-btn" class="w-20 h-20 rounded-full bg-white text-black flex items-center justify-center shadow-lg hover:scale-105 transition-transform">
                        <i class="fa-solid fa-play text-3xl ml-1"></i>
                    </button>
                    <button class="text-white/70 hover:text-white transition-colors"><i class="fa-solid fa-forward-step text-3xl"></i></button>
                </div>
            </div>
        </div>

        <div class="relative z-10 p-8 flex justify-between items-center max-w-lg mx-auto w-full">
            <i class="fa-solid fa-quote-right text-white/50 hover:text-white cursor-pointer"></i>
            <i class="fa-solid fa-list text-white/50 hover:text-white cursor-pointer"></i>
        </div>
    </div>

    <div id="create-playlist-modal" class="fixed inset-0 bg-black/80 z-[60] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-xl w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold mb-4">Create Playlist</h2>
            <p id="pending-song-msg" class="text-xs text-purple-400 mb-4 hidden"><i class="fa-solid fa-circle-info mr-1"></i> Selected song will be added automatically</p>
            <input type="text" id="new-playlist-name" placeholder="Playlist Name" class="w-full bg-zinc-800 border border-zinc-700 rounded-md p-3 mb-4 text-white focus:outline-none focus:border-purple-500">
            <div class="flex justify-end gap-3">
                <button onclick="closeCreatePlaylistModal()" class="px-4 py-2 rounded-md text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors">Cancel</button>
                <button onclick="confirmCreatePlaylist()" class="px-4 py-2 rounded-md bg-purple-600 hover:bg-purple-500 text-white font-medium transition-colors">Create</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { firebaseConfig } from "../firebase-config.js";
        import { checkAdminStatus } from "../utils.js";

        // Mock Data since we removed the iframe connection
        const songs = [
            { id: 1, title: "Come Over", artist: "12AM", cover: "https://i.scdn.co/image/ab67616d0000b273d4060855260846271c607755", duration: "1:55" },
            { id: 2, title: "Midnight City", artist: "M83", cover: "https://i.scdn.co/image/ab67616d0000b273187c9dcc21798394e3c983f4", duration: "4:03" },
            { id: 3, title: "Starboy", artist: "The Weeknd", cover: "https://i.scdn.co/image/ab67616d0000b2734718e28d24527d9774d194c8", duration: "3:50" },
            { id: 4, title: "Neon Lights", artist: "Synthwave", cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1000&auto=format&fit=crop", duration: "2:45" }
        ];

        // State
        let playlists = [];
        let currentSong = null;
        let pendingPlaylistSong = null; // Stores song waiting for playlist creation

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        const loader = document.getElementById('loader');
        const appContent = document.getElementById('app-content');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Keep admin check logic
                const isAdmin = await checkAdminStatus(user.uid);
                if (isAdmin) {
                    loader.style.display = 'none';
                    appContent.style.display = 'flex'; // Show new UI
                    appContent.classList.remove('hidden');
                    renderSongs();
                } else {
                    window.location.href = '../logged-in/dashboard.html';
                }
            } else {
                window.location.href = '../authentication.html';
            }
        });

        // UI Functions exposed to window for onclick handlers
        window.renderSongs = () => {
            const grid = document.getElementById('song-grid');
            grid.innerHTML = songs.map(song => `
                <div class="bg-zinc-900 hover:bg-zinc-800 p-4 rounded-xl group transition-colors cursor-pointer relative">
                    <div class="relative mb-4 overflow-hidden rounded-lg shadow-lg">
                        <img src="${song.cover}" class="w-full aspect-square object-cover group-hover:scale-105 transition-transform duration-500">
                        <button onclick="playSong(${song.id})" class="absolute bottom-2 right-2 w-10 h-10 bg-purple-500 rounded-full shadow-lg flex items-center justify-center opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300">
                            <i class="fa-solid fa-play text-white ml-1"></i>
                        </button>
                    </div>
                    <h3 class="font-bold text-white truncate">${song.title}</h3>
                    <p class="text-zinc-400 text-sm truncate mb-3">${song.artist}</p>
                    <button onclick="attemptAddToPlaylist(${song.id})" class="w-full py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs font-medium transition-colors">
                        <i class="fa-solid fa-plus mr-1"></i> Add to Playlist
                    </button>
                </div>
            `).join('');
        }

        window.playSong = (id) => {
            const song = songs.find(s => s.id === id);
            if (!song) return;
            currentSong = song;
            
            // Update Mini Player
            document.getElementById('mini-title').innerText = song.title;
            document.getElementById('mini-artist').innerText = song.artist;
            document.getElementById('mini-cover').src = song.cover;
            
            // Update Fullscreen Player
            document.getElementById('fs-title').innerText = song.title;
            document.getElementById('fs-artist').innerText = song.artist;
            document.getElementById('fs-cover').src = song.cover;
            document.getElementById('fs-bg').style.backgroundImage = `url('${song.cover}')`;
        }

        window.toggleFullscreenPlayer = () => {
            if(!currentSong) return;
            const fs = document.getElementById('fullscreen-player');
            fs.classList.toggle('active');
        }

        // Playlist Logic
        window.attemptAddToPlaylist = (songId) => {
            const song = songs.find(s => s.id === songId);
            
            // If no playlists exist, trigger the "Smart Create" flow
            if (playlists.length === 0) {
                pendingPlaylistSong = song; // Store the song
                document.getElementById('pending-song-msg').classList.remove('hidden');
                document.getElementById('pending-song-msg').innerHTML = `<i class="fa-solid fa-check mr-1"></i> "${song.title}" will be added automatically`;
                window.openCreatePlaylistModal();
            } else {
                // Normal add logic would go here (show playlist selector)
                alert(`Added ${song.title} to your existing playlist (Mock)`);
            }
        }

        window.openCreatePlaylistModal = () => {
            document.getElementById('create-playlist-modal').classList.remove('hidden');
        }

        window.closeCreatePlaylistModal = () => {
            document.getElementById('create-playlist-modal').classList.add('hidden');
            // Do not clear pending song here in case they reopen, or clear it if you prefer strict reset
            // pendingPlaylistSong = null; 
        }

        window.confirmCreatePlaylist = () => {
            const nameInput = document.getElementById('new-playlist-name');
            const name = nameInput.value.trim();
            if (!name) return;

            const newPlaylist = {
                id: Date.now(),
                name: name,
                songs: []
            };

            // Smart Logic: Add the pending song if it exists
            if (pendingPlaylistSong) {
                newPlaylist.songs.push(pendingPlaylistSong);
                console.log(`Automatically added ${pendingPlaylistSong.title} to ${name}`);
            }

            playlists.push(newPlaylist);
            
            // Render Sidebar Playlist
            const list = document.getElementById('playlist-list');
            const item = document.createElement('div');
            item.className = "px-3 py-2 rounded-md hover:bg-zinc-800 text-zinc-400 text-sm cursor-pointer transition-colors flex justify-between";
            item.innerHTML = `<span><i class="fa-solid fa-list-music mr-3"></i>${name}</span> <span class="text-xs bg-zinc-800 px-2 rounded text-zinc-500">${newPlaylist.songs.length}</span>`;
            
            // If it was the first playlist, clear the "No playlists" text
            if (playlists.length === 1) list.innerHTML = '';
            list.appendChild(item);

            // Cleanup
            nameInput.value = '';
            pendingPlaylistSong = null;
            document.getElementById('pending-song-msg').classList.add('hidden');
            window.closeCreatePlaylistModal();
        }

    </script>
</body>
</html>
